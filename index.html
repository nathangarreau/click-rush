<style>
/* Layout: one phone-width column; navy app bar, cream game table, coloured player strips like the board sides */
:root{
  --bg:#F3EEE5; --surface:#FFFFFF; --surface2:#ECE5D9; --ink:#23262C; --mute:#6E6A63; --line:#E0D7C8;
  --bar:#1F3552; --bar2:#2C4A70; --onbar:#F7F4EE;
  --teal:#3F7778; --tealx:#E1EEEC; --blue:#4E6E99; --bluex:#E4EBF5; --gold:#E8B54A; --goldd:#9C7020; --goldx:#FBF0D6;
  --red:#A3393F; --redx:#F7E1E2; --coin:#F2E3B3; --coinb:#C9AE62;
  --p0:#C9788A; --p1:#5F8F50; --p2:#8571B0; --p3:#D08440;
  --ok:#3F7778; --shadow:0 1px 2px rgba(31,53,82,.08),0 6px 18px rgba(31,53,82,.08);
  --font:'Jost',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111925; --surface:#1A2535; --surface2:#223047; --ink:#EDF0F4; --mute:#9AA5B6; --line:#2C3B52;
  --bar:#0C1420; --bar2:#16243A; --onbar:#EDF0F4;
  --teal:#6FB0AE; --tealx:#1D3436; --blue:#86A3CF; --bluex:#1D2A40; --gold:#E8B54A; --goldd:#E8C26A; --goldx:#3A3020;
  --red:#E07278; --redx:#3A1F24; --coin:#E9D48F; --coinb:#B39545;
  --p0:#DE8EA0; --p1:#7FB36F; --p2:#A592D0; --p3:#E29A58; --ok:#6FB0AE; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111925; --surface:#1A2535; --surface2:#223047; --ink:#EDF0F4; --mute:#9AA5B6; --line:#2C3B52;
  --bar:#0C1420; --bar2:#16243A; --onbar:#EDF0F4;
  --teal:#6FB0AE; --tealx:#1D3436; --blue:#86A3CF; --bluex:#1D2A40; --gold:#E8B54A; --goldd:#E8C26A; --goldx:#3A3020;
  --red:#E07278; --redx:#3A1F24; --coin:#E9D48F; --coinb:#B39545;
  --p0:#DE8EA0; --p1:#7FB36F; --p2:#A592D0; --p3:#E29A58; --ok:#6FB0AE; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;margin:0;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(100deg,var(--bar2),var(--bar));color:var(--onbar);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:9px;background:none;border:0;padding:0;color:var(--onbar)}
.brand b{font-weight:600;letter-spacing:.14em;font-size:15px;white-space:nowrap}
.bar .tabs{display:flex;gap:6px}
body.ingame .brand b{display:none}@media (min-width:460px){body.ingame .brand b{display:inline}}.brand b span{color:#9CC4C4;font-style:italic}
.bar .sp{flex:1}
.bar .tab{background:rgba(255,255,255,.1);border:0;border-radius:20px;padding:6px 12px;font-size:13px;font-weight:500;color:var(--onbar)}
.bar .tab[aria-pressed="true"]{background:var(--gold);color:#23262C}
main{max-width:560px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:28px;font-weight:600;line-height:1.1}
h2{font-size:21px;font-weight:600}
h3{font-size:16px;font-weight:600}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.panel{background:var(--surface);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.muted{color:var(--mute)}
.small{font-size:13.5px}
.row{display:flex;gap:10px;align-items:center}
.stack{display:flex;flex-direction:column;gap:10px}
.btn{border:0;border-radius:14px;padding:14px 18px;font-weight:600;font-size:16px;background:var(--surface2);color:var(--ink)}
.btn.primary{background:var(--teal);color:#fff}
.btn.dark{background:var(--bar2);color:var(--onbar)}
.btn.gold{background:var(--gold);color:#23262C}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.steps div{text-align:center;font-size:12.5px;font-weight:600;padding:8px 2px;border-radius:12px;background:var(--surface2);color:var(--mute)}
.steps div.on{background:var(--ink);color:var(--bg)}
.steps div.done{background:var(--tealx);color:var(--teal)}
.months{display:flex;gap:6px;align-items:center}
.months i{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:13px;font-weight:600;color:var(--mute)}
.months i.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.months i.done{background:var(--tealx);border-color:var(--tealx);color:var(--teal)}
.pl{border-left:6px solid var(--pc);}
.dot{width:14px;height:14px;border-radius:50%;background:var(--pc);flex:none}
.pname{font-weight:600}
.coins{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.coin{width:22px;height:22px;border-radius:50%;background:var(--coin);border:2px solid var(--coinb);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#23262C}
.hand{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hcard{position:relative;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 6px 8px;text-align:center;font-size:12.5px;font-weight:600;line-height:1.15}
.hcard img{display:block;width:100%;aspect-ratio:470/682;object-fit:cover;border-radius:8px;margin-bottom:5px;max-width:100%}
.hcard .c{position:absolute;top:2px;left:2px}
.hcard[aria-pressed="true"]{border-color:var(--gold);background:var(--goldx);box-shadow:0 0 0 2px var(--gold)}
.hcard:disabled{opacity:.35}
.hcard.owned{opacity:1;border-style:dashed}
.hcard.owned img{filter:grayscale(.6) opacity(.6)}
.tag{display:inline-block;font-size:11.5px;font-weight:600;letter-spacing:.06em;padding:3px 8px;border-radius:20px}
.tag.stay{background:var(--tealx);color:var(--teal)}.tag.once{background:var(--bluex);color:var(--blue)}.tag.bh{background:var(--redx);color:var(--red)}

// Pedagogical content: what each card means in real digital marketing
const LEARN = {
  seo:{kind:'Channel card', title:'SEO', full:'Search Engine Optimisation',
    what:'All the work that helps your website appear higher in the free results of Google: using the words people really type, writing useful pages, making the site fast and easy on a phone, and getting links from other websites.',
    real:'Results take weeks or months, but then visitors keep coming without paying for each click. That is why SEO is a long-term investment.',
    ex:'A bike shop in Angers writes a page "How to choose your first road bike". A few months later it is on page 1 of Google and brings visitors every day, for free.',
    rem:'Slow to start, free later. Very few people go to page 2 of Google.'},
  blog:{kind:'Channel card', title:'Blog', full:'Content marketing',
    what:'Publishing useful articles, guides or videos that answer your customers\' questions. People find them on Google or social media, then discover your brand.',
    real:'Good content builds trust and helps your SEO: each new article is one more page Google can show. One good article can bring visitors for years.',
    ex:'A cooking brand posts "10 dinners in 15 minutes". People save it, share it and come back to the website.',
    rem:'Content = free visitors that add up month after month.'},
  landing:{kind:'Channel card', title:'Landing page', full:'A page built for one action',
    what:'The page a visitor "lands" on after clicking an ad or a link. It has one goal (buy, sign up, book), one clear message and one big button.',
    real:'Marketers measure the conversion rate of their landing pages and test two versions to keep the best one (A/B testing). A better page turns more of the same visitors into customers, without paying for more traffic.',
    ex:'An ad for running shoes opens a page with those shoes, the price, reviews and a "Buy now" button, not the homepage of the whole shop.',
    rem:'More visitors are useless if they don\'t become customers.'},
  gads:{kind:'Channel card', title:'Google Ads', full:'SEA: Search Engine Advertising',
    what:'Paid ads shown at the top of Google results, marked "Sponsored". You choose keywords and you pay each time someone clicks: the cost per click (CPC).',
    real:'The price of a click comes from an auction between all the brands that want the same keyword, and from the quality of your ad. Visitors arrive the same day, but they stop as soon as your budget stops.',
    ex:'Someone types "sneakers Angers" and your ad appears first. 100 clicks at €0.80 = €80 spent.',
    rem:'SEA: you pay for visitors. SEO: you earn them. Together they are called SEM (Search Engine Marketing).'},
  social:{kind:'Channel card', title:'Social Ads', full:'Paid ads on social media',
    what:'Sponsored posts and videos on Instagram, TikTok, Facebook, Snapchat or LinkedIn. You choose who sees them: age, city, interests.',
    real:'They are often paid for every 1,000 views (CPM). Great to make a brand known, but people scroll for fun, not to buy, so fewer of them click than on Google Ads.',
    ex:'A sports brand shows a 10-second video to 18 to 25 year-olds near Angers who follow running accounts.',
    rem:'Social ads are about targeting the right people. Search ads catch people who are already looking.'},
  inf:{kind:'Channel card', title:'Influencer', full:'Influencer marketing',
    what:'Paying or partnering with a content creator so they show your product to their community.',
    real:'The result is hard to predict: a post can go viral or be ignored. Smaller creators (micro-influencers) often get more engagement for a lower price.',
    law:'In France, a law from June 2023 says creators must clearly label paid content, for example with "Publicité" or "Collaboration commerciale".',
    ex:'A skincare brand works with 5 creators of 20,000 followers each and gives each one a promo code, so it can count the sales from each creator.',
    rem:'Big reach, uncertain result. Always use a code or a link to measure it.'},

  bh_followers:{kind:'Black Hat card', title:'Fake followers', full:'Buying followers, likes or views',
    what:'Paying for followers or likes that come from robots or fake accounts, so a brand looks popular.',
    real:'Social networks regularly delete fake accounts, so the numbers drop. Robots never buy anything, and a big audience with almost no comments shows the trick to customers and partners.',
    rem:'Followers are not customers.'},
  bh_reviews:{kind:'Black Hat card', title:'Fake reviews', full:'Writing or buying 5-star reviews',
    what:'Writing reviews yourself, or paying people to write them, to get 5 stars on Google, Amazon or TripAdvisor.',
    real:'Customers trust reviews a lot, and that is exactly why faking them is banned.',
    law:'Fake reviews are illegal in the European Union: since 2022, sellers must not publish them and must say how they check that reviews are real. In France, the consumer protection agency (DGCCRF) fines companies that do it.',
    rem:'Ask real customers for reviews and reply to them, even the bad ones.'},
  bh_spam:{kind:'Black Hat card', title:'Spam emails', full:'Emails people never asked for',
    what:'Sending advertising emails to people who never agreed to receive them, often from a bought list of addresses.',
    real:'Spam filters quickly send your emails to the junk folder, so even your real customers stop seeing them.',
    law:'In France and the EU, you usually need people\'s consent before sending them marketing emails (GDPR and French law), and every email needs an unsubscribe link. The CNIL can fine companies that don\'t respect this.',
    rem:'Build your own list: a newsletter sign-up with clear consent.'},
  bh_keyword:{kind:'Black Hat card', title:'Keyword stuffing', full:'Repeating a keyword to trick Google',
    what:'Repeating the same keyword again and again on a page, sometimes in hidden text, to trick Google.',
    real:'It worked in the early 2000s. Today Google\'s spam rules detect it and the page drops in the results. Visitors also leave fast, because the text is unreadable.',
    rem:'Write for humans first: use your keyword naturally, in the title and a few times in the text.'},
  bh_links:{kind:'Black Hat card', title:'Bought links', full:'Paying for backlinks',
    what:'Paying other websites to add links to your site. Links from other sites (backlinks) are a strong signal for Google, so some brands try to buy them.',
    real:'Google calls this a "link scheme" and it is against its rules.',
    story:'In 2011, the American department store J.C. Penney fell in Google\'s results for many searches after the New York Times revealed thousands of paid links pointing to its site.',
    rem:'Earn links with content people want to share: studies, tools, great guides.'},
  bh_clickbait:{kind:'Black Hat card', title:'Clickbait', full:'Titles that promise too much',
    what:'Titles or thumbnails that promise something shocking or exciting that the content doesn\'t deliver.',
    real:'People click, feel tricked and leave in a few seconds (a high bounce rate). Facebook, for example, shows less of this kind of content, and the brand loses trust.',
    rem:'A good title is attractive and honest.'},
  bh_cloaking:{kind:'Black Hat card', title:'Cloaking', full:'One page for Google, another for people',
    what:'Showing one page to Google\'s robot and a different page to real visitors.',
    real:'It is one of the worst offences in Google\'s rules: the whole site can disappear from Google.',
    story:'In 2006, Google removed BMW\'s German website from its results because it showed Google special pages that visitors never saw. BMW changed its site and came back a few days later.',
    rem:'Google must see the same page as your visitors.'},
  bh_comment:{kind:'Black Hat card', title:'Comment spam', full:'Dropping links in comments',
    what:'Posting messages with a link to your site in the comments of blogs, forums or social media posts.',
    real:'Most websites mark these links so they don\'t help SEO, and spam filters delete them. People see it as spam and think less of the brand.',
    rem:'Join conversations to help people, not to drop links.'},

  ev_google:{kind:'Market News', title:'Google Update', full:'Google changes its algorithm',
    real:'Google changes the way it ranks websites several times a year. Sites that cheat or have poor content can lose a big part of their traffic overnight.',
    rem:'Never depend on one channel only, and follow the rules.'},
  ev_adblock:{kind:'Market News', title:'Ad Blocker', full:'People block ads',
    real:'Many people use ad blockers on their browser. Your ads reach fewer people for the same budget.',
    rem:'Mix paid ads with free channels.'},
  ev_viral:{kind:'Market News', title:'Viral Trend', full:'A topic explodes on social media',

function deckLeft() {
  const used = {}; Object.values(S.news).forEach(k => used[k] = (used[k] || 0) + 1);

function emptyPlan() { return S.players.map(() => ({ cards:[], bh:false, bhk:null, inf:null, rolls:[] })); }
function costOf(k, news) { return k === 'gads' && news === 'adprices' ? 4 : CARDS[k].cost; }
function cardsCost(plan, news) { return plan.cards.reduce((s, k) => s + costOf(k, news), 0); }
// Black Hat cards already on a player's side (the deck has 8 different cards)
function bhTaken() { return S.players.flatMap(p => p.bh.map(b => b.k)); }
function bhAvailable(i) { const t = bhTaken(), other = S.plan.filter((x, j) => j !== i && x.bh && x.bhk).map(x => x.bhk); return BHORDER.filter(k => !t.includes(k) && !other.includes(k)); }
// Can the player pay the drawn card? Channel cards are paid first, the face-down coin counts.
function bhPaid(p, plan, news) { return !!(plan.bh && plan.bhk && p.coins - cardsCost(plan, news) >= BH[plan.bhk].c); }
function oldBh(p) { return p.bh.filter(b => b.m < S.month); }
function threshold(k, news) { return news === 'google' ? 3 : BH[k].f; }

// Pure scoring for one player and one month (same rules as the rulebook)
function compute(p, plan, news, month, shared) {
  const has = k => p.owned[k] != null || plan.cards.includes(k);
  const v = { seo:0, blog:0, gads:0, social:0, inf:0, bh:0 };
  const f = (base, k, x = 1) => Math.floor(base * mult(p, k) * x);
  if (p.owned.seo != null && p.owned.seo < month) v.seo = news === 'google' ? 0 : f(15, 'seo');
  if (has('blog')) v.blog = news === 'google' ? 0 : f(10, 'blog', news === 'article' ? 3 : 1);
  if (plan.cards.includes('gads')) v.gads = f(shared ? 15 : 25, 'gads', (news === 'adblock' || news === 'cookie') ? 0.5 : 1);
  if (plan.cards.includes('social')) v.social = f(15, 'social', news === 'adblock' ? 0.5 : news === 'viral' ? 2 : 1);
  if (plan.cards.includes('inf') && plan.inf) v.inf = f(plan.inf <= 2 ? 0 : plan.inf <= 4 ? 25 : 50, 'inf', news === 'viral' ? 2 : 1);
  const paid = bhPaid(p, plan, news);
  if (paid) v.bh = BH[plan.bhk].v;
  let total = v.seo + v.blog + v.gads + v.social + v.inf + v.bh;
  const raw = total;
  if (news === 'crash') total = Math.floor(total / 2);
  const conv = has('landing') ? 7 : 10;
  let gain = Math.floor(total / conv);
  const lost = total - gain * conv;
  if (news === 'blackfriday') gain *= 2;
  const spent = cardsCost(plan, news) + (plan.bh ? (paid ? BH[plan.bhk].c : 1) : 0);
  let after = p.customers + gain, penalty = false, penaltyLoss = 0, caughtBy = null;
  p.bh.filter(b => b.m < month).forEach((b, r) => { const x = plan.rolls[r]; if (!penalty && x && x <= threshold(b.k, news)) { penalty = true; caughtBy = b.k; } });
  if (penalty) { penaltyLoss = after - Math.floor(after / 2); after = Math.floor(after / 2); }
  return { v, shared, raw, total, conv, gain, lost, spent, before:p.customers, after, penalty, penaltyLoss, caughtBy, paid, coinsAfter:p.coins - spent };
}
const STAY_MAX = 2;
const staysOf = (p, x) => Object.keys(p.owned).length + x.cards.filter(k => CARDS[k].type === 'stay').length;
function planError(i) {
  const p = S.players[i], x = S.plan[i], news = S.news[S.month];
  const n = x.cards.length + (x.bh ? 1 : 0);
  if (staysOf(p, x) > STAY_MAX) return 'Max 2 cards that stay for the whole game.';
  const cost = cardsCost(x, news) + (x.bh ? 1 : 0);
  if (n > 2) return 'Max 2 cards per month (Black Hat included).';
  if (cost > p.coins) return `Not enough coins: this costs ${cost}, you have ${p.coins}.`;
  if (x.cards.includes('inf') && !x.inf) return 'Roll the die for the Influencer and tap the result.';
  if (x.bh && !x.bhk) return 'Tap the Black Hat card you drew.';
  return '';
}

let setupN = 4, setupNames = DEFAULT_NAMES.slice();
function setup() {
  const rows = Array.from({ length: setupN }, (_, i) => `
    <div class="row pl panel" style="--pc:${pc(i)};padding:10px 12px">
      ${pawnSvg(i, 28)}
      <div style="flex:1;min-width:0"><label class="small muted" for="pn${i}">${COLORS[i].n} side · brand name</label>
      <input type="text" id="pn${i}" maxlength="18" value="${esc(setupNames[i])}" data-name="${i}"></div></div>`).join('');
  return `
  <div><div class="eyebrow">New game</div><h1>Who is playing?</h1></div>
  <section class="panel stack"><h3>Number of players</h3>
    <div class="seg">${[2,3,4].map(n => `<button data-n="${n}" aria-pressed="${setupN === n}">${n} players</button>`).join('')}</div>
    <p class="small muted" style="margin:0">Each player sits on the side of the board of their colour and puts their pawn on START.</p></section>
  <section class="stack">${rows}</section>
  <button class="btn primary block" data-act="start">Start month 1</button>`;
}

function stepsBar() {
  return `<div class="months" aria-label="Month ${S.month} of 5"><span class="eyebrow" style="margin-right:4px">Month</span>${[1,2,3,4,5].map(m => `<i class="${m === S.month ? 'on' : m < S.month ? 'done' : ''}">${m}</i>`).join('')}</div>
  <div class="steps">${STEPS.map((s, i) => `<div class="${i === S.step ? 'on' : i < S.step ? 'done' : ''}">${i + 1}. ${s}</div>`).join('')}</div>`;
}

function game() {
  if (S.done) { view = 'dash'; return dash(); }
  if (!S.plan) S.plan = emptyPlan();
  return stepsBar() + [stepCoins, stepNews, stepPlay, stepScore][S.step]();
}

function stepCoins() {
  if (S.coinsGiven < S.month) { S.players.forEach(p => p.coins += 4); S.coinsGiven = S.month; S.plan = emptyPlan(); save(); }
  return `
  <section class="panel stack pop"><h2>Step 1 · Take your coins</h2>
    <p class="muted small" style="margin:0">Everybody takes <b>4 coins</b> from the bank. Coins you don't spend are kept for next month.</p>
    ${S.players.map((p, i) => `<div class="row pl" style="--pc:${pc(i)};padding:6px 0 6px 10px"><span class="pname" style="flex:1">${esc(p.name)}</span><span class="coins num">${coinIcon(p.coins)} coins</span></div>`).join('')}
  </section>
  <button class="btn primary block" data-act="next">Next: read the news</button>`;
}

function stepNews() {
  const left = deckLeft(), sel = S.news[S.month];
  const grid = Object.keys(NEWS).map(k => {
    const avail = left.filter(x => x === k).length + (sel === k ? 1 : 0);
    return `<button class="ncard" data-news="${k}" aria-pressed="${sel === k}" ${avail ? '' : 'disabled'} aria-label="${NEWS[k].name}"><img src="cards/ev_${k}.webp" alt="">${NEWS[k].n > 1 ? `<span class="x">×${avail}</span>` : ''}</button>`;
  }).join('');
  return `
  <section class="panel stack"><h2>Step 2 · Read the news</h2>
    <p class="muted small" style="margin:0">Turn over the top Market News card, then tap the same card here. It changes this month for everyone.</p>
    ${sel ? `<div class="effect pop"><img src="cards/ev_${sel}.webp" alt=""><div><h3>${NEWS[sel].name}</h3><div class="small">${NEWS[sel].fx}</div></div></div>
      <div class="irl"><b>In real life:</b> ${LEARN['ev_' + sel].real} <button class="info inline" data-info="ev_${sel}" aria-label="Learn more about ${NEWS[sel].name}">i</button></div>` : ''}
    <div class="news">${grid}</div>
    <button class="btn ghost" data-act="draw">No cards? Draw one for me</button>
  </section>
  <div class="row"><button class="btn ghost" data-act="back">Back</button><button class="btn primary" style="flex:1" data-act="next" ${sel ? '' : 'disabled'}>Next: play your cards</button></div>`;
}

function stepPlay() {
  const news = S.news[S.month];
  const panels = S.players.map((p, i) => {
    const x = S.plan[i];
    const n = x.cards.length + (x.bh ? 1 : 0);
    const r = compute(p, x, news, S.month, gadsShared(i));
    const cards = ORDER.map(k => {
      const owned = p.owned[k] != null, on = x.cards.includes(k), c = costOf(k, news);
      const full = CARDS[k].type === 'stay' && !owned && !on && staysOf(p, x) >= STAY_MAX;
      const dis = owned || (!on && n >= 2) || full;
      return `<div class="hwrap"><button class="hcard ${owned ? 'owned' : ''}" data-p="${i}" data-card="${k}" aria-pressed="${on}" ${dis ? 'disabled' : ''}>
        <img src="${CARDS[k].img}" alt="">${CARDS[k].name}<br><span class="muted" style="font-weight:500">${owned ? 'on your side' : full ? 'max 2 stay' : pl(c, 'coin')}</span>${k === 'landing' ? '' : multTag(p, k)}</button>${infoBtn(k, CARDS[k].name)}</div>`;
    }).join('');
    const avail = bhAvailable(i);
    const bhDis = !x.bh && (n >= 2 || !avail.length);
    let bhBlock = '';
    if (x.bh && !x.bhk) bhBlock = `<div class="stack" style="gap:6px"><div class="small" style="font-weight:600">Draw the top Black Hat card and tap it:</div>
      <div class="bhgrid">${avail.map(k => `<div class="hwrap"><button class="hcard" data-p="${i}" data-bhk="${k}"><img src="cards/bh_${k}.webp" alt="">+${BH[k].v}<br><span class="muted" style="font-weight:500">${pl(BH[k].c, 'coin')}</span></button>${infoBtn('bh_' + k, bhName(k))}</div>`).join('')}</div></div>`;
    else if (x.bh && x.bhk) {
      const b = BH[x.bhk], ok = r.paid;
      bhBlock = `<div class="bhpick"><img src="cards/bh_${x.bhk}.webp" alt=""><div style="flex:1;min-width:0"><b>${bhName(x.bhk)}</b> ${infoBtn('bh_' + x.bhk, bhName(x.bhk), 'inline')}
        <div class="small">${ok ? `+${b.v} visitors this month · pay ${pl(b.c, 'coin')} (your face-down coin counts)` : `You can't pay ${pl(b.c, 'coin')}. The card goes back under the deck and you lose your face-down coin.`}</div>
        <button class="btn ghost" style="padding:6px 10px;font-size:13px;margin-top:6px" data-p="${i}" data-act="bhredo">Wrong card?</button></div></div>`;
    }
    const err = planError(i);
    return `<section class="panel pl stack" style="--pc:${pc(i)}">
      <div class="row"><span class="pname" style="flex:1">${esc(p.name)}</span><span class="coins num">${coinIcon(err ? p.coins : r.coinsAfter)} left</span></div>
      ${audChip(p)}
      <div class="hand">${cards}</div>
      ${x.cards.includes('gads') && gadsShared(i) ? '<div class="small" style="font-weight:600;color:var(--red)">Auction! Another player also plays Google Ads: +15 instead of +25.</div>' : ''}
      <button class="btn ${x.bh ? 'gold' : 'ghost'}" data-p="${i}" data-act="bh" aria-pressed="${x.bh}" ${bhDis ? 'disabled' : ''}>
        ${x.bh ? '✓ ' : ''}Black Hat (1 coin face down) <span class="tag bh">${avail.length + (x.bh && x.bhk ? 1 : 0)} in the deck</span></button>
      ${bhBlock}
      ${x.cards.includes('inf') ? `<div><div class="small" style="font-weight:600;margin-bottom:6px">Influencer: roll the die and tap the result</div>
        <div class="dice">${[1,2,3,4,5,6].map(d => `<button class="die num" data-p="${i}" data-inf="${d}" aria-pressed="${x.inf === d}">${d}</button>`).join('')}</div>
        <div class="small muted" style="margin-top:4px">1-2 = 0 · 3-4 = +25 · 5-6 = +50 visitors${mult(p, 'inf') !== 1 ? ` (${mult(p, 'inf') > 1 ? '★ ×1.5' : '½'} for your audience)` : ''}</div></div>` : ''}
      ${err ? `<div class="err">${err}</div>` : `<div class="small muted">${n === 0 ? 'No card this month: saving coins.' : `${pl(n, 'card')} · ${pl(r.spent, 'coin')} to pay`}</div>`}
    </section>`;
  }).join('');
  const ok = S.players.every((_, i) => !planError(i));
  return `
  <section class="panel stack"><h2>Step 3 · Play your cards</h2>
    <p class="muted small" style="margin:0">Everybody chooses 0, 1 or 2 cards face down. Shout <b>"Click… Rush!"</b>, reveal, pay the bank. Then tap the cards each player revealed.</p>
    ${news ? `<div class="effect"><img src="cards/ev_${news}.webp" alt=""><div><div class="eyebrow">News of the month</div><h3>${NEWS[news].name}</h3><div class="small">${NEWS[news].fx}</div></div></div>` : ''}
  </section>
  ${panels}
  <div class="row"><button class="btn ghost" data-act="back">Back</button><button class="btn primary" style="flex:1" data-act="next" ${ok ? '' : 'disabled'}>Next: score</button></div>`;
}

function stepScore() {
  const news = S.news[S.month];
  const olds = S.players.map(p => oldBh(p));
  const rollsOk = S.players.every((p, i) => olds[i].every((_, r) => S.plan[i].rolls[r]));
  const rollPanels = S.players.map((p, i) => olds[i].length ? `
    <section class="panel pl stack" style="--pc:${pc(i)}"><div class="row"><span class="pname" style="flex:1">${esc(p.name)}</span><span class="tag bh">${pl(olds[i].length, 'Black Hat card')}</span></div>
      <div class="small">Google audit: roll the die once for each card and tap the result.</div>
      ${olds[i].map((b, r) => `<div class="roll"><div class="small"><b>${bhName(b.k)}</b> · caught on ${dieWord(threshold(b.k, news))}${news === 'google' ? ' (Google Update!)' : ''}</div>
        <div class="dice">${[1,2,3,4,5,6].map(d => `<button class="die num" data-p="${i}" data-roll="${r}" data-val="${d}" aria-pressed="${S.plan[i].rolls[r] === d}">${d}</button>`).join('')}</div></div>`).join('')}
    </section>` : '').join('');
  let results = '';
  if (rollsOk) {
    results = S.players.map((p, i) => {
      const r = compute(p, S.plan[i], news, S.month, gadsShared(i));
      const rows = Object.entries(r.v).filter(([, x]) => x > 0).map(([k, x]) => `<span>${k === 'bh' ? 'Black Hat: ' + bhName(S.plan[i].bhk) : CARDS[k].name}${k !== 'bh' && mult(p, k) !== 1 ? (mult(p, k) > 1 ? ' ★' : ' ½') : ''}${k === 'gads' && r.shared ? ' (auction)' : ''}</span><span class="num">+${x}</span>`).join('');
      const lvBefore = level(r.before), lvAfter = level(r.after);
      const up = lvAfter[0] > lvBefore[0] && !r.penalty;
      return `<section class="panel pl stack pop" style="--pc:${pc(i)}">
        <div class="row"><span class="pname" style="flex:1">${esc(p.name)}</span><span class="small muted">spent ${pl(r.spent, 'coin')} · ${coinIcon(r.coinsAfter)} left</span></div>
        <div class="res num">${rows || '<span class="muted">No visitors this month</span><span></span>'}
          ${news === 'crash' && r.raw ? `<span>Website Crash ÷ 2</span><span>${r.total}</span>` : ''}
          <span class="t">${r.total} visitors ÷ ${r.conv}</span><span class="t">${pl(r.gain, 'customer')}${news === 'blackfriday' && r.gain ? ' (×2)' : ''}</span></div>
        ${r.lost ? `<div class="small muted">${pl(r.lost, 'extra visitor')} lost: not enough for one more customer.</div>` : ''}
        ${r.penalty ? `<div class="alert">Google caught your ${bhName(r.caughtBy)}! Customers divided by 2: −${r.penaltyLoss}. All your Black Hat cards go back under the deck.</div>` : ''}
        <div class="pawn">${pawnSvg(i, 34)}<div style="flex:1"><div class="small muted">Move your pawn to</div><div class="big num">${r.after}${r.after >= 60 ? ` <span class="small">(2nd lap: ${r.after - 60})</span>` : ''}</div></div>
          ${up ? `<span class="lvl">★ ${lvAfter[1]}!</span>` : `<span class="small muted">${lvAfter[1]}</span>`}</div>
      </section>`;
    }).join('');
  }
  return `
  <section class="panel stack"><h2>Step 4 · Score</h2>
    <p class="muted small" style="margin:0"><b>10 visitors = 1 customer</b> (7 with a Landing page). That is your <b>conversion rate</b> ${infoBtn('t_convrate', 'conversion rate', 'inline')}</p></section>
  ${rollPanels}
  ${rollsOk ? results : '<p class="small muted" style="margin:0;text-align:center">Enter the Black Hat rolls to see the results.</p>'}
  <div class="row"><button class="btn ghost" data-act="back">Back</button><button class="btn primary" style="flex:1" data-act="commit" ${rollsOk ? '' : 'disabled'}>${S.month < 5 ? 'Confirm month ' + S.month : 'Confirm and see the winner'}</button></div>`;
}

function commit() {
  prev = JSON.stringify(S);
  const news = S.news[S.month];
  S.players.forEach((p, i) => {
    const x = S.plan[i], r = compute(p, x, news, S.month, gadsShared(i));
    x.cards.forEach(k => { if (CARDS[k].type === 'stay') p.owned[k] = S.month; });
    if (r.paid) p.bh.push({ k:x.bhk, m:S.month });
    if (r.penalty) p.bh = [];   // caught: all Black Hat cards go back under the deck
    p.coins = r.coinsAfter; p.customers = r.after;
    p.hist.push({ m:S.month, news, cards:x.cards.slice(), bh:r.paid ? x.bhk : null, inf:x.inf, v:r.v, total:r.total, gain:r.gain, lost:r.lost, spent:r.spent, penalty:r.penalty, penaltyLoss:r.penaltyLoss, after:r.after });
  });
  if (S.month >= 5) S.done = true; else { S.month++; S.step = 0; }
  S.plan = null; save();
  view = S.done ? 'dash' : 'summary'; render();
}

function ranked() { return S.players.map((p, i) => ({ p, i })).sort((a, b) => b.p.customers - a.p.customers || b.p.coins - a.p.coins); }
function rankList() {
  return ranked().map(({ p, i }, r) => `<div class="rank"><b class="num">${r + 1}</b><span class="dot" style="--pc:${pc(i)}"></span>
    <span><span class="pname">${esc(p.name)}</span><br><span class="small muted">${level(p.customers)[1]}${p.persona ? ' · ' + PERSONAS[p.persona].name : ''}</span></span>
    <span class="coins small num">${coinIcon(p.coins)}</span><b class="num" style="font-size:20px">${p.customers}</b></div>`).join('');
}

function summary() {
  const m = S.month - 1;
  return `
  <div><div class="eyebrow">End of month ${m}</div><h1>Ranking after month ${m}</h1></div>
  <section class="panel"><div class="row small muted" style="justify-content:flex-end;gap:18px;padding-bottom:4px"><span>coins</span><span>customers</span></div>${rankList()}</section>
  <section class="panel small muted">Take back in your hand the one-shot cards you played (Google Ads, Social Ads, Influencer). SEO, Blog, Landing page and Black Hat cards stay on your side. Move the month marker to month ${S.month}.</section>
  <button class="btn primary block" data-act="resume">Start month ${S.month}</button>
  <div class="row"><button class="btn ghost" style="flex:1" data-go="dash">Stats</button><button class="btn ghost" style="flex:1" data-act="undo">Undo month ${m}</button></div>`;
}

function chart(players) {
  const max = Math.max(10, ...players.flatMap(({ p }) => p.hist.map(h => h.total)));
  const top = Math.ceil(max * 1.12 / 20) * 20;
  return ({ p }) => {
    const W = 300, H = 120, L = 28, B = 18, bw = 30, gap = (W - L - 5 * bw) / 5;
    const y = v => H - B - (v / top) * (H - B - 8);
    let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Visitors per month for ${esc(p.name)}">`;
    [0, top / 2, top].forEach(t => { s += `<line x1="${L}" x2="${W}" y1="${y(t)}" y2="${y(t)}" stroke="var(--soft)" stroke-width="1"/><text x="${L - 6}" y="${y(t) + 4}" text-anchor="end" font-size="10" fill="var(--mute)">${t}</text>`; });
    for (let m = 1; m <= 5; m++) {
      const x = L + gap / 2 + (m - 1) * (bw + gap), h = p.hist.find(z => z.m === m);
      if (h) {
        const crash = h.news === 'crash' ? 0.5 : 1;
        const org = Math.floor((h.v.seo + h.v.blog) * crash), bh = Math.floor(h.v.bh * crash), paid = Math.max(0, h.total - org - bh);
        let y0 = H - B;
        [[org, 'var(--teal)'], [paid, 'var(--blue)'], [bh, 'var(--red)']].forEach(([val, c]) => { if (val > 0) { const hh = (val / top) * (H - B - 8); s += `<rect x="${x}" y="${y0 - hh}" width="${bw}" height="${hh}" fill="${c}" stroke="var(--ink)" stroke-width="1" rx="2"/>`; y0 -= hh; } });
        s += `<text x="${x + bw / 2}" y="${y0 - 3}" text-anchor="middle" font-size="10" font-weight="600" fill="var(--ink)">${h.total}</text>`;
      } else s += `<rect x="${x}" y="${H - B - 30}" width="${bw}" height="30" fill="none" stroke="var(--soft)" stroke-dasharray="3 3" rx="2"/>`;
      s += `<text x="${x + bw / 2}" y="${H - 4}" text-anchor="middle" font-size="10" fill="var(--mute)">M${m}</text>`;
    }
    return s + '</svg>';
  };
}

function stats(p) {
  const sum = k => p.hist.reduce((s, h) => s + (k ? h.v[k] : h.total), 0);
  const visitors = sum(), spent = p.hist.reduce((s, h) => s + h.spent, 0), gained = p.hist.reduce((s, h) => s + h.gain, 0);
  const org = sum('seo') + sum('blog'), paid = sum('gads') + sum('social') + sum('inf'), bh = sum('bh');
  const raw = org + paid + bh || 1;
  return { visitors, spent, gained, org, paid, bh, raw,
    conv: visitors ? Math.round(100 * gained / visitors) : 0,
    cac: p.customers ? (spent / p.customers).toFixed(1) : '–',
    lost: p.hist.reduce((s, h) => s + h.lost, 0), penalties: p.hist.filter(h => h.penalty).length,
    penaltyLoss: p.hist.reduce((s, h) => s + h.penaltyLoss, 0) };
}

function advice(p) {
  const s = stats(p), out = [];
  if (s.penalties) out.push(`Google caught your Black Hat ${s.penalties > 1 ? s.penalties + ' times' : 'once'}: cheating cost you ${pl(s.penaltyLoss, 'customer')}.`);
  else if (p.bh.length) out.push(`You took ${pl(p.bh.length, 'Black Hat card')} and were never caught: lucky! In real life, Google penalties can last for months.`);
  if (p.owned.seo != null) out.push(`Your SEO from month ${p.owned.seo} brought ${p.hist.reduce((a, h) => a + h.v.seo, 0)} free visitors.`);
  else out.push('No SEO this game: organic traffic is slow to start but it keeps coming for free. Try it in month 1.');
  if (p.owned.landing == null && s.visitors >= 60) out.push(`No Landing page: with one, your ${s.visitors} visitors could have become about ${Math.floor(s.visitors / 7)} customers instead of ${Math.floor(s.visitors / 10)}.`);
  if (s.paid / s.raw > 0.7) out.push(`${Math.round(100 * s.paid / s.raw)}% of your traffic was paid: it stops as soon as you stop paying.`);
  if (s.lost >= 15) out.push(`${s.lost} visitors were lost to rounding: aim for round numbers of visitors.`);
  return out.slice(0, 3);
}

function dash() {
  if (!S) { view = 'home'; return home(); }
  const R = ranked(), ch = chart(R), final = S.done;
  const kpi = (val, label, t) => `<div class="kpi"><b>${val}</b><span>${label}</span>${t ? infoBtn('t_' + t, label) : ''}</div>`;
  const cards = R.map(x => {
    const s = stats(x.p);
    return `<section class="panel pl stack" style="--pc:${pc(x.i)}">
      <div class="row"><span class="pname" style="flex:1">${esc(x.p.name)}</span><span class="small muted">${level(x.p.customers)[1]}</span></div>
      <div class="kpis num">${kpi(x.p.customers, 'customers')}${kpi(s.visitors, 'visitors', 'traffic')}${kpi(s.conv + '%', 'conversion rate', 'convrate')}${kpi(s.cac, 'coins per customer (CAC)', 'cac')}</div>
      ${x.p.hist.length ? ch(x) : '<p class="small muted" style="margin:0">The chart appears after month 1.</p>'}
      ${final ? `<div class="stack" style="gap:6px"><div class="eyebrow">What you learned</div>${advice(x.p).map(a => `<div class="advice"><i></i><span>${a}</span></div>`).join('')}</div>` : ''}
    </section>`;
  }).join('');
  const w = R[0];
  return `
  ${final ? `<section class="hero pop"><div style="position:relative;z-index:1">${pawnSvg(w.i, 56)}</div><p style="margin-top:8px">The winner is</p><div class="wm" style="font-size:30px">${esc(w.p.name)}</div><p>${pl(w.p.customers, 'customer')} · ${level(w.p.customers)[1]}</p></section>`
    : `<div><div class="eyebrow">Month ${S.month} of 5</div><h1>Ranking</h1></div>`}
  <section class="panel"><div class="row small muted" style="justify-content:flex-end;gap:18px;padding-bottom:4px"><span>coins</span><span>customers</span></div>${rankList()}</section>
  <div class="legend"><span><i style="background:var(--teal)"></i>Organic (SEO, Blog)</span><span><i style="background:var(--blue)"></i>Paid (Ads, Influencer)</span><span><i style="background:var(--red)"></i>Black Hat</span></div>
  ${cards}
  ${final ? `<section class="panel stack"><h2>2-minute debrief</h2><ol class="s"><li>Which channel brought you the most customers?</li><li>Why did the winner win?</li><li>What would you change next time?</li></ol></section>
    <button class="btn primary block" data-act="new-yes">New game</button>` : `<button class="btn primary block" data-act="resume">Back to month ${S.month}</button>`}`;
}

function learn() {
  const tabs = [['channel','Channel cards'],['aud','Audiences'],['bh','Black Hat'],['news','Market News'],['words','Marketing words']];
  const row = (k, img, title, sub) => `<button class="lrow" data-info="${k}">${img ? `<img src="${img}" alt="">` : ''}<span style="flex:1;min-width:0"><b>${title}</b><small>${sub}</small></span><span class="chev" aria-hidden="true">›</span></button>`;
  let body = '';
  if (learnTab === 'channel') body = `<p class="small muted" style="margin:0 0 4px">The 6 ways to bring visitors to your website. The first 3 stay (but you can keep only 2 of them for the whole game), the last 3 work for one month.</p>` + ORDER.map(k => row(k, CARDS[k].img, `${CARDS[k].name}`, LEARN[k].full)).join('');
  else if (learnTab === 'bh') body = `<p class="small muted" style="margin:0 0 4px"><b>Black hat</b> = tricks that break the rules of Google or social networks to get fast results. Fast… and risky. Here is why.</p>` + BHORDER.map(k => row('bh_' + k, `cards/bh_${k}.webp`, LEARN['bh_' + k].title, LEARN['bh_' + k].full)).join('');
  else if (learnTab === 'news') body = `<p class="small muted" style="margin:0 0 4px">Real events that change the market, for every brand at once.</p>` + Object.keys(NEWS).map(k => row('ev_' + k, `cards/ev_${k}.webp`, NEWS[k].name, LEARN['ev_' + k].full)).join('');
  else if (learnTab === 'aud') body = `<p class="small muted" style="margin:0 0 8px">At the start, the app gives each brand one of these 6 audiences.</p>` + Object.keys(PERSONAS).map(k => `<div style="padding:8px 0;border-bottom:1.5px dashed var(--soft)">${personaCard(k)}</div>`).join('');
  else body = `<dl>${TERMS.map(t => `<dt>${t[1]}</dt><dd>${t[2]}</dd>`).join('')}</dl>`;
  return `
  <div><div class="eyebrow">Learn</div><h1>Real marketing, card by card</h1></div>
  <div class="chips" role="group" aria-label="Topics">${tabs.map(([k, l]) => `<button data-lt="${k}" aria-pressed="${learnTab === k}">${l}</button>`).join('')}</div>
  <section class="panel">${body}</section>
  <section class="panel stack"><h3>How to play, in 4 steps</h3><ol class="s">
    <li><b>Coins:</b> take 4 coins. Keep what you don't spend.</li>
    <li><b>News:</b> turn over a Market News card. It is for everyone.</li>
    <li><b>Play:</b> 0, 1 or 2 cards face down. Shout "Click… Rush!", reveal, pay.</li>
    <li><b>Score:</b> 10 visitors = 1 customer. Move your pawn. The most customers after 5 months wins.</li></ol></section>
  <button class="btn primary block" data-go="${S && !S.done ? 'game' : 'home'}">${S && !S.done ? 'Back to the game' : 'Back'}</button>`;
}

// ---------------------------------------------------------------- events
app.addEventListener('input', e => { const i = e.target.dataset.name; if (i != null) setupNames[+i] = e.target.value; });
dlg.addEventListener('click', e => { if (e.target === dlg) closeInfo(); });
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t || t.disabled) return;
  const d = t.dataset;
  if (d.info) { openInfo(d.info); return; }
  if (d.act === 'close') { closeInfo(); return; }
  if (d.lt) { learnTab = d.lt; render(); return; }
  if (d.go) { view = d.go === 'game' ? (S && !S.done ? 'game' : (S ? 'dash' : 'home')) : d.go; confirmNew = false; render(); return; }
  if (d.n) { setupN = +d.n; render(); return; }
  if (d.news) { S.news[S.month] = d.news; save(); render(); return; }
  if (d.card) { const x = S.plan[+d.p], k = d.card; const ix = x.cards.indexOf(k); if (ix >= 0) { x.cards.splice(ix, 1); if (k === 'inf') x.inf = null; } else x.cards.push(k); save(); render(); return; }
  if (d.bhk) { S.plan[+d.p].bhk = d.bhk; save(); render(); return; }
  if (d.inf) { S.plan[+d.p].inf = +d.inf; save(); render(); return; }
  if (d.roll) { S.plan[+d.p].rolls[+d.roll] = +d.val; save(); render(); return; }
  const a = d.act;
  if (a === 'new') { if (S && !S.done) { confirmNew = true; render(); } else { view = 'setup'; render(); } }
  else if (a === 'new-no') { confirmNew = false; render(); }
  else if (a === 'new-yes') { confirmNew = false; view = 'setup'; render(); }
  else if (a === 'start') { S = newGame(setupNames.slice(0, setupN).map((n, i) => n.trim() || DEFAULT_NAMES[i])); prev = null; save(); view = 'audience'; render(); }
  else if (a === 'play') { view = 'game'; render(); }
  else if (a === 'resume') { view = 'game'; render(); }
  else if (a === 'next') { S.step = Math.min(3, S.step + 1); save(); render(); }
  else if (a === 'back') { S.step = Math.max(0, S.step - 1); save(); render(); }
  else if (a === 'draw') { const left = deckLeft(); const cur = S.news[S.month]; if (cur) left.push(cur); const pick = left[Math.floor(Math.random() * left.length)]; S.news[S.month] = pick; save(); render(); toast('Drawn: ' + NEWS[pick].name); }
  else if (a === 'bh') { const x = S.plan[+d.p]; x.bh = !x.bh; x.bhk = null; save(); render(); }
  else if (a === 'bhredo') { S.plan[+d.p].bhk = null; save(); render(); }
  else if (a === 'commit') commit();
  else if (a === 'undo') { if (prev) { S = JSON.parse(prev); prev = null; S.step = 3; save(); view = 'game'; render(); toast('Month undone'); } else toast('Nothing to undo'); }
});

S = load();
if (S && S.v !== 4) S = null;
render();

})();
</script>
</body></html>
